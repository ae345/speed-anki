<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>スピード暗記帳</title>
<meta name="description" content="期末テストの計画と暗記を1つにまとめた勉強アプリ">
<meta name="theme-color" content="#e4eae7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111816" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="暗記帳">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: a study app on a desk. Ring-bound word cards, a red check-sheet over answers, and a day's to-do list you tick off from the top. */
:root{
  --desk:#e4eae7; --card:#fffefa; --ink:#1b2928; --muted:#586866; --rule:#cbd6d2; --soft:#edf2ef;
  --sheet:#d92f46; --sheet-ink:#ffffff; --sheet-soft:#fbe2e5;
  --again:#c22f2f; --hard:#a86300; --good:#1b7443; --easy:#2155a3;
  --round:"Zen Maru Gothic","Hiragino Maru Gothic ProN","BIZ UDPGothic",sans-serif;
  --body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --desk:#111816; --card:#1b2422; --ink:#e5eeeb; --muted:#9db0ab; --rule:#33423e; --soft:#232f2c;
  --sheet:#e2566a; --sheet-ink:#ffffff; --sheet-soft:#43232a;
  --again:#ff7d74; --hard:#efa63c; --good:#62cf93; --easy:#89b4ef; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--desk);color:var(--ink);font:15px/1.65 var(--body);font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
h1,h2,h3,p,ul,ol{margin:0}
.app{height:100%;display:flex;flex-direction:column;max-width:720px;margin:0 auto;padding-top:env(safe-area-inset-top,0px)}
.screen{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:18px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;align-content:start;gap:16px}
.muted{color:var(--muted)} .small{font-size:13px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:8px 16px;flex-wrap:wrap}
.top h1{font:700 24px/1.3 var(--round);text-wrap:balance}
.count{font:700 15px/1.3 var(--round);color:var(--sheet)} .count b{font-size:30px;margin:0 2px}
.panel{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:16px;display:grid;gap:12px;min-width:0}
.panel h2{font:700 18px/1.4 var(--round)}
.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.num{display:grid;gap:0;min-width:0} .num span{font-size:12px;color:var(--muted)} .num b{font:700 26px/1.25 var(--round)} .num b small{font-size:13px;font-weight:500}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:999px;background:var(--ink);color:var(--card);font-weight:700;text-align:center}
.btn.big{width:100%;padding:14px 18px;font-size:17px}
.btn.line{background:transparent;color:var(--ink);border:1.5px solid var(--ink);padding:8px 16px}
.btn.text{background:transparent;color:var(--muted);padding:6px 8px;font-weight:400;border-radius:6px}
.btn.danger{color:var(--again)}
.btn.go{background:var(--good);color:#fff}
.btn[disabled]{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--easy);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{all:unset;cursor:pointer;padding:3px 12px;font-size:13px;border:1px solid var(--rule);border-radius:999px;background:var(--card)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--card);font-weight:700}
.notice{border:1px solid var(--sheet);background:var(--sheet-soft);border-radius:10px;padding:10px 14px;font-size:14px}
/* today list */
.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.meter{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.meter i{display:block;height:100%;background:var(--good);border-radius:0 4px 4px 0}
.subj{font:700 13px var(--round);color:var(--muted);letter-spacing:.04em;margin:4px 0 -4px}
.tasks{list-style:none;padding:0;display:grid;gap:8px}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:12px 14px}
.task.done{opacity:.6}
.task .check{all:unset;cursor:pointer;width:26px;height:26px;border-radius:50%;border:2px solid var(--rule);display:grid;place-items:center;font-weight:700;color:#fff}
.task.done .check{background:var(--good);border-color:var(--good)}
.task .body{all:unset;cursor:pointer;min-width:0;display:grid;gap:1px}
.task .body strong{font-weight:700;overflow-wrap:anywhere}
.task.done .body strong{text-decoration:line-through}
.task .body span{font-size:12px;color:var(--muted)}
.task .go{font:700 13px var(--round);color:var(--easy);white-space:nowrap}
.late{border-color:var(--sheet)}
/* decks */
.decks{list-style:none;padding:0;display:grid;gap:0}
.deck{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:11px 0;border-top:1px solid var(--soft)}
.deck:first-child{border-top:0}
.deck strong{display:block;overflow-wrap:anywhere}
.deck .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.deck .acts .btn{padding:7px 13px;font-size:13px}
/* study */
.study{flex:1;min-height:0;display:flex;flex-direction:column;padding-top:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.prog{height:4px;background:var(--rule);border-radius:2px;overflow:hidden;margin:6px 0 10px}
.prog i{display:block;height:100%;background:var(--ink)}
.cardwrap{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:12px}
.wcard{position:relative;background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:22px 18px 18px 40px;display:grid;gap:14px;box-shadow:0 1px 0 var(--rule),0 6px 18px -12px rgba(0,0,0,.35)}
.wcard::before{content:"";position:absolute;left:14px;top:20px;width:12px;height:12px;border-radius:50%;background:var(--desk);border:1px solid var(--rule)}
.meta{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.tag{font-size:11px;font-weight:700;border:1px solid var(--sheet);color:var(--sheet);padding:0 6px;border-radius:4px}
.front{font-size:19px;line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere}
.opts{display:grid;gap:7px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:center;padding:10px 12px;border:1.5px solid var(--rule);border-radius:10px;font-size:16px;overflow-wrap:anywhere}
.opt b{font:700 15px var(--round);color:var(--muted)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent)}
.opt.wrong{border-color:var(--again);background:color-mix(in srgb,var(--again) 12%,transparent)}
.opt[disabled]{cursor:default}
.cover{all:unset;box-sizing:border-box;cursor:pointer;display:grid;place-items:center;min-height:84px;border-radius:10px;background:var(--sheet);color:var(--sheet-ink);font-weight:700;opacity:.9}
.answer{border-top:2px dashed var(--rule);padding-top:12px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.answer b{color:var(--good)}
.controls{padding-block:10px max(14px,env(safe-area-inset-bottom,0px));display:grid;gap:8px;background:var(--desk)}
.hint{text-align:center;font-size:12px;color:var(--muted)}
.rate{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.rate.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.rate button{all:unset;box-sizing:border-box;cursor:pointer;display:grid;gap:1px;text-align:center;padding:11px 4px;border-radius:12px;border:2px solid currentColor;background:var(--card);font:700 15px var(--round)}
.rate button small{font:400 11px var(--body);color:var(--muted)}
.rate button.rec{box-shadow:0 0 0 3px color-mix(in srgb,currentColor 30%,transparent)}
.r1{color:var(--again)} .r2{color:var(--hard)} .r3{color:var(--good)} .r4{color:var(--easy)}
/* focus */
.timer{font:700 56px/1 var(--round);text-align:center;letter-spacing:.02em}
.timer small{display:block;font:400 13px var(--body);color:var(--muted);margin-top:6px;letter-spacing:0}
/* forms */
form{display:grid;gap:10px}
label{display:grid;gap:3px;font-size:12px;font-weight:700;min-width:0}
input[type=number],input[type=date],input[type=text],select,textarea{width:100%;min-width:0;font:16px var(--body);color:var(--ink);background:var(--desk);border:1px solid var(--rule);border-radius:8px;padding:7px 9px}
textarea{min-height:70px;resize:vertical}
.err{font-size:13px;color:var(--again)} .ok{font-size:13px;color:var(--good)}
.mlist{list-style:none;padding:0;display:grid}
.mlist li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:9px 0;border-top:1px solid var(--soft);align-items:start}
.mlist li:first-child{border-top:0}
.mlist div{overflow-wrap:anywhere;white-space:pre-wrap;font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.steps{margin:0;padding-left:20px;display:grid;gap:4px;font-size:14px}
pre.tmpl{margin:0;white-space:pre-wrap;font:13px/1.6 var(--body);background:var(--desk);border:1px solid var(--rule);border-radius:8px;padding:10px}
/* bottom tabs */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--rule);background:var(--card);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs button{all:unset;cursor:pointer;text-align:center;padding:10px 0 8px;font:700 13px var(--round);color:var(--muted);display:grid;gap:2px;justify-items:center}
.tabs button i{font-style:normal;font-size:18px;line-height:1}
.tabs button[aria-current="page"]{color:var(--ink)}
.tabs button[aria-current="page"] i{color:var(--sheet)}
@media (max-width:420px){.front{font-size:17px}.wcard{padding:20px 14px 16px 34px}.wcard::before{left:11px}.num b{font-size:22px}.timer{font-size:48px}}
@media (prefers-reduced-motion:no-preference){.prog i,.meter i{transition:width .2s}}
</style>
</head>
<body>
<div class="app">
  <main class="screen" id="welcome" hidden></main>
  <main class="screen" id="today" hidden></main>
  <main class="screen" id="plan" hidden></main>
  <main class="screen" id="decks" hidden></main>
  <main class="screen" id="settings" hidden></main>
  <main class="screen" id="library" hidden></main>
  <main class="screen" id="focus" hidden></main>
  <section class="study" id="study" hidden></section>
  <main class="screen" id="manage" hidden>
    <div class="top"><h1>カードの追加と管理</h1><button class="btn line" data-act="tab" data-tab="decks" id="m-back">戻る</button></div>
    <div class="panel">
      <h2>デッキを選ぶ</h2>
      <select id="m-deck" aria-label="カードを追加するデッキ"></select>
      <form id="nd-form" class="grid2">
        <label>新しいデッキの名前<input type="text" id="nd-title" maxlength="40" placeholder="例：数学 二次関数"></label>
        <label>科目<select id="nd-subject"></select></label>
        <div class="row"><button class="btn line" type="submit" id="nd-save">デッキを作る</button><span id="nd-msg"></span></div>
      </form>
    </div>
    <div class="panel">
      <h2>1枚ずつ追加</h2>
      <form id="one-form">
        <label>表（問題）<textarea id="m-front" maxlength="600" required></textarea></label>
        <label>裏（答えと理由）<textarea id="m-back" maxlength="900" required></textarea></label>
        <div class="row"><button class="btn" type="submit" id="m-save">追加する</button><span id="m-msg"></span></div>
      </form>
    </div>
    <div class="panel">
      <h2>まとめて追加</h2>
      <p class="muted small">1行に1枚、表と裏を「｜」で区切ります。Claudeに「暗記帳に貼れる形でカードを作って」と頼むと、この形で作ってくれます。<br>例：How long does it take の意味は？｜（時間が）どれくらいかかるか</p>
      <form id="bulk-form">
        <label>カード<textarea id="b-text" style="min-height:150px" maxlength="50000"></textarea></label>
        <div class="row"><button class="btn" type="submit" id="b-save">まとめて追加する</button><span id="b-msg"></span></div>
      </form>
    </div>
    <div class="panel"><div class="top"><h2>このデッキのカード</h2><span class="muted small" id="m-count"></span></div><div id="m-list"></div></div>
  </main>
  <nav class="tabs" id="tabs" aria-label="画面の切り替え">
    <button data-act="tab" data-tab="today" id="tab-today"><i>●</i>今日</button>
    <button data-act="tab" data-tab="plan" id="tab-plan"><i>▤</i>計画</button>
    <button data-act="tab" data-tab="decks" id="tab-decks"><i>▭</i>暗記</button>
    <button data-act="tab" data-tab="settings" id="tab-settings"><i>⚙</i>設定</button>
  </nav>
</div>
<script src="library.js"></script>
<script src="plans.js"></script>
<script>
(function(){
const SUBJECTS=['英語','論理・表現','国語','数学','理科','社会','情報','その他','全科目'];
const MARK='①②③④⑤⑥';
const KEY='speed-anki-v1';
const LIB=Array.isArray(window.LIBRARY)?window.LIBRARY:[];
const PLANS=Array.isArray(window.PLANS)?window.PLANS:[];
const TABS=['today','plan','decks','settings'];
const ASK_TEMPLATE='スピード暗記帳に貼れる形で、期末テストの勉強計画を作って。\n・テストの初日：◯月◯日\n・科目と範囲：（例）数学 教科書p.40〜75、英語 Lesson 4〜6 …\n・苦手な科目：\n・1日に使える時間：平日◯分、休日◯分\n形式は1行に1つ「日付｜科目｜やること｜分」。';
function blank(){return {decks:[],srs:{cards:{},newCount:{},log:{},newLimit:40},examDate:'',setup:false,plan:null,done:{},scores:[]}}
function load(){
  try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d&&Array.isArray(d.decks)){const b=blank();return Object.assign(b,d,{srs:Object.assign(b.srs,d.srs||{}),done:d.done||{},scores:d.scores||[]})}}catch(e){}
  return blank();
}
let D=load();
const S={screen:D.setup?'today':'welcome',tab:'today',filter:'all',run:null,confirm:null,manageDeck:null,saveErr:'',pendingImport:null,focus:null,timer:null,showPast:false,returnTo:null};
function persist(){try{localStorage.setItem(KEY,JSON.stringify(D));S.saveErr=''}catch(e){S.saveErr='保存できませんでした。スマホの空き容量を確認してください。'}}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}

const $=id=>document.getElementById(id);
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
function today(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function utc(s){const[a,b,c]=String(s).split('-').map(Number);return Date.UTC(a,b-1,c)}
function dayStart(t){const d=new Date(t);return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime()}
function shift(s,n){const d=new Date(utc(s)+n*864e5);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())}
function dayLabel(s){const[a,b,c]=s.split('-').map(Number);return b+'月'+c+'日（'+'日月火水木金土'[new Date(a,b-1,c).getDay()]+'）'}
const isDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(s||'');
function examDate(){return isDate(D.examDate)?D.examDate:(D.plan&&isDate(D.plan.examDate)?D.plan.examDate:'')}
function daysLeft(){const e=examDate();return e?Math.round((utc(e)-utc(today()))/864e5):null}
function setMsg(id,text,ok){const el=$(id);if(!el)return;el.className=ok?'ok':'err';el.textContent=text}
const subjOrder=s=>{const i=SUBJECTS.indexOf(s);return i<0?50:i};

/* cards & scheduling */
function allCards(){
  const out=[];
  D.decks.slice().sort((a,b)=>(a.order||0)-(b.order||0)).forEach(d=>(d.cards||[]).forEach((c,i)=>out.push({
    key:d.id+':'+(c.id||i),deckId:d.id,deckTitle:d.title||'',subject:c.subject||d.subject||'',category:c.category||'',
    front:c.front||'',back:c.back||'',options:Array.isArray(c.options)&&c.options.length?c.options:null,answer:typeof c.answer==='number'?c.answer:-1})));
  return out;
}
const visible=()=>allCards().filter(c=>S.filter==='all'||c.subject===S.filter);
const stateOf=k=>{const s=(D.srs.cards||{})[k];return s&&typeof s==='object'?s:null};
const newLimit=()=>{const v=Number(D.srs.newLimit);return D.srs.newLimit!=null&&Number.isFinite(v)?v:40};
const newToday=()=>(D.srs.newCount||{})[today()]||0;
const logOf=t=>Object.assign({n:0,again:0,cram:0},(D.srs.log||{})[t]);
function counts(cards){
  const now=Date.now();let due=0,fresh=0,learned=0;
  cards.forEach(c=>{const s=stateOf(c.key);if(!s)fresh++;else{if(s.due<=now)due++;if(s.ivl>=7)learned++}});
  return {due,fresh,learned,total:cards.length,avail:Math.min(fresh,Math.max(0,newLimit()-newToday()))};
}
function streak(){let t=today(),n=0;const has=d=>{const l=logOf(d);return l.n+l.cram>0||Object.values(D.done).some(v=>v&&v.date===d)};if(!has(t))t=shift(t,-1);while(has(t)){n++;t=shift(t,-1)}return n}
function schedule(prev,r){
  const now=Date.now(),s=prev?Object.assign({},prev):{ivl:0,ease:2.5,reps:0,lapses:0};
  if(r===1){s.lapses=(s.lapses||0)+1;s.reps=0;s.ivl=0;s.ease=Math.max(1.3,s.ease-0.2);s.due=now+60e3}
  else{
    if(r===2){s.ivl=s.reps===0?0:Math.max(1,Math.round(s.ivl*1.2));s.ease=Math.max(1.3,s.ease-0.15)}
    else if(r===3){s.ivl=s.reps===0?1:s.reps===1?3:Math.max(s.ivl+1,Math.round(s.ivl*s.ease))}
    else{s.ivl=s.reps===0?3:Math.max(s.ivl+2,Math.round(Math.max(s.ivl,1)*s.ease*1.3));s.ease=s.ease+0.15}
    const left=daysLeft(),cap=left!=null&&left>1?Math.min(14,left-1):14;
    s.ivl=Math.min(s.ivl,Math.max(1,cap));s.reps++;
    s.due=s.ivl===0?now+10*60e3:dayStart(now)+s.ivl*864e5;
  }
  s.last=now;return s;
}
function ivlLabel(s){const m=Math.round((s.due-Date.now())/60e3);return m<60?Math.max(1,m)+'分後':s.ivl+'日後'}
function setState(k,s){D.srs.cards=Object.assign({},D.srs.cards,{[k]:s})}
function setLog(t,l){D.srs.log=Object.assign({},D.srs.log,{[t]:l})}
function setNew(t,n){D.srs.newCount=Object.assign({},D.srs.newCount,{[t]:n})}
function mix(due,fresh){const out=[];let i=0,j=0;while(i<due.length||j<fresh.length){for(let k=0;k<3&&i<due.length;k++)out.push(due[i++]);if(j<fresh.length)out.push(fresh[j++])}return out}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* plan */
const tasks=()=>(D.plan&&Array.isArray(D.plan.tasks))?D.plan.tasks:[];
const isDone=id=>!!D.done[id];
function setDone(id,v){if(v)D.done[id]={at:Date.now(),date:today()};else delete D.done[id];persist()}
function resolveDecks(list){return (list||[]).map(x=>D.decks.find(d=>d.id===x||d.title===x)).filter(Boolean)}
function reviewState(){
  const all=allCards();if(!all.length)return null;
  const k=counts(all),lg=logOf(today());
  return {left:k.due+k.avail,done:k.due+k.avail===0&&lg.n>0,started:lg.n>0,lg};
}
function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return 't'+(h>>>0).toString(36)}
function guessYear(m,d){
  const now=new Date(),y=now.getFullYear();
  const c=new Date(y,m-1,d);return (c-now)/864e5< -180?y+1:y;
}
function parseDate(s){
  s=String(s||'').trim().replace(/[年月\/.]/g,'-').replace(/日/g,'').replace(/（.*?）|\(.*?\)/g,'').trim();
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);if(m)return m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]);
  m=s.match(/^(\d{1,2})-(\d{1,2})$/);if(m){const y=guessYear(+m[1],+m[2]);return y+'-'+pad(+m[1])+'-'+pad(+m[2])}
  return '';
}
function parsePlan(text){
  text=String(text||'').trim();if(!text)throw new Error('empty');
  if(text[0]==='{'){
    const o=JSON.parse(text);if(!Array.isArray(o.tasks))throw new Error('no tasks');
    return {title:o.title||'読み込んだ計画',examDate:isDate(o.examDate)?o.examDate:'',tasks:o.tasks.filter(t=>t&&isDate(t.date)&&t.title).map(t=>({id:t.id||hash(t.date+t.subject+t.title),date:t.date,subject:t.subject||'その他',title:String(t.title),min:Number(t.min)||0,decks:Array.isArray(t.decks)?t.decks:[],kind:t.kind||'book'}))};
  }
  let title='読み込んだ計画',exam='';const out=[],bad=[];
  text.split(/\r?\n/).forEach((raw,i)=>{
    const l=raw.trim();if(!l||l[0]==='#')return;
    let m=l.match(/^(?:タイトル|計画名)[:：]\s*(.+)$/);if(m){title=m[1].trim();return}
    m=l.match(/^(?:テスト|テストの初日|試験日)[:：]\s*(.+)$/);if(m){exam=parseDate(m[1]);return}
    const p=l.split(/\t|｜|\|/).map(x=>x.trim());
    const date=parseDate(p[0]);
    if(!date||p.length<3||!p[2]){bad.push(i+1);return}
    const decks=(p[4]||'').split(/[,、，]/).map(x=>x.trim()).filter(Boolean);
    out.push({id:hash(date+p[1]+p[2]),date,subject:p[1]||'その他',title:p[2],min:parseInt(p[3],10)||0,decks,kind:decks.length?'cards':'book'});
  });
  if(!out.length)throw new Error('no lines');
  return {title,examDate:exam,tasks:out,bad};
}
function usePlan(p,fromLib){D.plan={title:p.title,examDate:p.examDate||'',tasks:p.tasks.map(t=>Object.assign({},t)),updatedAt:Date.now(),libId:fromLib?p.id:null,version:fromLib?(p.version||1):null};if(p.examDate)D.examDate=p.examDate;persist()}

/* runs */
function startSrs(cards,taskId){
  const now=Date.now();
  const due=cards.filter(c=>{const s=stateOf(c.key);return s&&s.due<=now}).sort((a,b)=>stateOf(a.key).due-stateOf(b.key).due);
  const fresh=cards.filter(c=>!stateOf(c.key)).slice(0,Math.max(0,newLimit()-newToday()));
  const q=mix(due,fresh);if(!q.length)return false;
  S.run={mode:'srs',queue:q,total:q.length,shown:false,pick:null,done:0,right:0,history:[],missed:new Set(),taskId:taskId||null,back:S.screen};
  show('study');return true;
}
function startCram(cards,taskId){
  if(!cards.length)return;
  S.run={mode:'cram',queue:shuffle(cards),total:cards.length,shown:false,pick:null,done:0,right:0,history:[],missed:new Set(),taskId:taskId||null,back:S.screen};
  show('study');
}
function finishRun(){const r=S.run;if(r&&r.taskId&&!r.queue.length)setDone(r.taskId,true)}
function reveal(){const r=S.run;if(r&&r.queue.length&&!r.shown){r.shown=true;renderStudy()}}
function pick(i){const r=S.run;if(!r||r.shown)return;r.pick=i;r.shown=true;renderStudy()}
function recommended(){const r=S.run,c=r.queue[0];if(!c)return 3;return c.options&&r.pick!=null?(r.pick===c.answer?3:1):3}
function rate(v){
  const r=S.run;if(!r||!r.shown||!r.queue.length)return;
  const c=r.queue[0],prev=stateOf(c.key),s=schedule(prev,v),t=today(),lgPrev=logOf(t),ncPrev=newToday();
  r.history.push({key:c.key,prev,queue:r.queue.slice(),lgPrev,ncPrev,done:r.done,right:r.right,missedHad:r.missed.has(c.key)});
  r.queue.shift();
  setState(c.key,s);setLog(t,Object.assign({},lgPrev,{n:lgPrev.n+1,again:lgPrev.again+(v===1?1:0)}));
  if(!prev)setNew(t,ncPrev+1);
  if(v===1)r.missed.add(c.key);else r.right++;
  if(s.due-Date.now()<30*60e3)r.queue.splice(Math.min(3,r.queue.length),0,c);
  r.done++;r.shown=false;r.pick=null;if(!r.queue.length)finishRun();persist();renderStudy();
}
function cram(ok){
  const r=S.run;if(!r||!r.shown||!r.queue.length)return;
  const c=r.queue[0],t=today(),lgPrev=logOf(t);
  r.history.push({key:c.key,queue:r.queue.slice(),lgPrev,done:r.done,right:r.right,missedHad:r.missed.has(c.key)});
  r.queue.shift();
  if(ok){if(!r.missed.has(c.key))r.right++}else{r.missed.add(c.key);r.queue.splice(Math.min(4,r.queue.length),0,c)}
  r.done++;r.shown=false;r.pick=null;setLog(t,Object.assign({},lgPrev,{cram:lgPrev.cram+1}));if(!r.queue.length)finishRun();persist();renderStudy();
}
function undo(){
  const r=S.run;if(!r||!r.history.length)return;
  const h=r.history.pop(),t=today();
  r.queue=h.queue;r.done=h.done;r.right=h.right;if(!h.missedHad)r.missed.delete(h.key);r.shown=false;r.pick=null;
  setLog(t,h.lgPrev);
  if(r.mode==='srs'){if(h.prev)setState(h.key,h.prev);else{const c=Object.assign({},D.srs.cards);delete c[h.key];D.srs.cards=c}setNew(t,h.ncPrev)}
  persist();renderStudy();
}

/* navigation */
function show(s){
  S.screen=s;S.confirm=null;
  if(TABS.includes(s))S.tab=s;
  if(s!=='study')S.run=s==='study'?S.run:null;
  if(s!=='focus')stopTick();
  render();const el=$(s);if(el)el.scrollTop=0;
}
function back(){const r=S.run;const to=r&&r.back?r.back:S.tab;S.run=null;show(to==='study'?S.tab:to)}

/* decks */
const userDecks=()=>D.decks.filter(d=>!d.builtin);
function libGroups(){const g=[];LIB.forEach(d=>{const k=d.group||d.subject||'その他';let x=g.find(y=>y.name===k);if(!x){x={name:k,decks:[]};g.push(x)}x.decks.push(d)});return g}
function installLib(id){
  const l=LIB.find(x=>x.id===id);if(!l)return;
  const deck={id:l.id,title:l.title,subject:l.subject,order:l.order||0,builtin:true,version:l.version||1,cards:(l.cards||[]).map(c=>Object.assign({},c))};
  const i=D.decks.findIndex(d=>d.id===id);if(i>=0)D.decks[i]=deck;else D.decks.push(deck);
}
function removeDeck(id){
  D.decks=D.decks.filter(d=>d.id!==id);
  const c=Object.assign({},D.srs.cards);Object.keys(c).forEach(k=>{if(k.indexOf(id+':')===0)delete c[k]});D.srs.cards=c;persist();
}
function createDeck(title,subject){const deck={id:'u'+Date.now().toString(36),title:title||'自分のカード',subject:subject||'',order:100+D.decks.length,cards:[]};D.decks.push(deck);persist();return deck}
function targetDeck(){let d=userDecks().find(x=>x.id===S.manageDeck);if(!d){d=createDeck('自分のカード',$('nd-subject').value);S.manageDeck=d.id}return d}
function addCards(list){const d=targetDeck(),base=Date.now().toString(36);list.forEach((c,i)=>d.cards.push({id:'c'+base+'-'+i,front:c.front,back:c.back}));persist()}

/* timer for paper tasks */
function tick(){const el=$('timer-num');if(!el||!S.timer)return;const sec=Math.floor((S.timer.acc+(S.timer.start?Date.now()-S.timer.start:0))/1000);el.textContent=pad(Math.floor(sec/60))+':'+pad(sec%60)}
function stopTick(){if(S.timer&&S.timer.iv){clearInterval(S.timer.iv);S.timer.iv=null}}
function toggleTimer(){
  const t=S.timer;if(!t)return;
  if(t.start){t.acc+=Date.now()-t.start;t.start=null;stopTick()}else{t.start=Date.now();t.iv=setInterval(tick,1000)}
  renderFocus();
}

/* render helpers */
function installTip(){
  const standalone=(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||navigator.standalone;
  if(standalone)return '';
  return '<div class="panel"><h2>ホーム画面に追加すると、アプリのように使えます</h2><ol class="steps"><li>iPhoneは Safari で開き、共有ボタン（四角から矢印）を押す</li><li>「ホーム画面に追加」を選ぶ</li><li>ホーム画面の「暗記帳」アイコンから開く</li></ol><p class="muted small">Androidは Chrome のメニューから「ホーム画面に追加」を選びます。</p></div>';
}
function countdown(){const left=daysLeft();return left==null?'':'<p class="count">'+(left>0?'テストまで あと<b>'+left+'</b>日':left===0?'今日から本番':'テスト期間')+'</p>'}
function taskRow(t,late){
  const d=isDone(t.id),dk=resolveDecks(t.decks);
  const sub=(t.min?'目安'+t.min+'分':'')+(dk.length?(t.min?'・':'')+'カード'+dk.reduce((a,x)=>a+(x.cards||[]).length,0)+'枚':'')+(late?(t.min||dk.length?'・':'')+dayLabel(t.date)+'の分':'');
  return '<li class="task'+(d?' done':'')+(late?' late':'')+'"><button class="check" data-act="toggle" data-id="'+esc(t.id)+'" id="ck-'+esc(t.id)+'" aria-label="'+(d?'完了を取り消す':'完了にする')+'" aria-pressed="'+d+'">'+(d?'✓':'')+'</button><button class="body" data-act="open" data-id="'+esc(t.id)+'" id="op-'+esc(t.id)+'"><strong>'+esc(t.title)+'</strong>'+(sub?'<span>'+esc(sub)+'</span>':'')+'</button><span class="go">'+(d?'':(dk.length?'回す':'始める'))+'</span></li>';
}
function groupBySubject(list){
  const g={};list.forEach(t=>{(g[t.subject]=g[t.subject]||[]).push(t)});
  return Object.keys(g).sort((a,b)=>subjOrder(a)-subjOrder(b)).map(k=>({subject:k,items:g[k]}));
}

/* backup */
function backupText(){return JSON.stringify({app:'speed-anki',version:2,exportedAt:new Date().toISOString(),data:D})}
function parseBackup(text){const o=JSON.parse(text),d=o&&o.data?o.data:o;if(!d||!Array.isArray(d.decks)||!d.srs)throw new Error('bad');return d}
function askImport(text){
  try{S.pendingImport=parseBackup(text)}catch(e){S.pendingImport=null;$('imp-msg').innerHTML='<p class="err">バックアップとして読み込めませんでした。書き出したファイルかテキストをそのまま使ってください。</p>';return}
  const n=S.pendingImport.decks.reduce((a,d)=>a+(d.cards||[]).length,0);
  $('imp-msg').innerHTML='<p class="small">デッキ'+S.pendingImport.decks.length+'個・カード'+n+'枚のバックアップです。今のデータはすべて置き換わります。</p><div class="row"><button class="btn" data-act="import-confirm" id="imp-confirm">このバックアップで置き換える</button><button class="btn text" data-act="import-cancel" id="imp-cancel">やめる</button></div>';
}
async function exportFile(){
  const text=backupText(),name='anki-backup-'+today()+'.json';
  try{const file=new File([text],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'暗記帳のバックアップ'});return}}catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
}
function copyText(t,okCb,failCb){if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(okCb,failCb);else failCb()}

/* events */
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const a=b.dataset.act;
  if(b.dataset.filter){S.filter=b.dataset.filter;return renderDecks()}
  if(b.dataset.pick!==undefined)return pick(Number(b.dataset.pick));
  if(b.dataset.rate)return rate(Number(b.dataset.rate));
  if(b.dataset.cram!==undefined)return cram(b.dataset.cram==='1');
  if(!a)return;
  switch(a){
    case 'tab':return show(b.dataset.tab);
    case 'library':return show('library');
    case 'manage':return show('manage');
    case 'past':S.showPast=true;return renderPlan();
    case 'toggle':setDone(b.dataset.id,!isDone(b.dataset.id));return render();
    case 'open':{S.focus=b.dataset.id;const t=tasks().find(x=>x.id===S.focus);if(!t)return;return show('focus')}
    case 'review':{const all=allCards();if(!startSrs(all))show('decks');return}
    case 'focus-cards':{const t=tasks().find(x=>x.id===S.focus);if(!t)return;const ids=resolveDecks(t.decks).map(d=>d.id);return startCram(allCards().filter(c=>ids.includes(c.deckId)),t.id)}
    case 'focus-done':setDone(S.focus,true);return show(S.tab);
    case 'focus-undone':setDone(S.focus,false);return renderFocus();
    case 'timer':return toggleTimer();
    case 'reveal':return reveal();
    case 'undo':return undo();
    case 'run-back':return back();
    case 'srs-all':return startSrs(visible());
    case 'srs':return startSrs(visible().filter(c=>c.deckId===b.dataset.deck));
    case 'cram':return startCram(visible().filter(c=>c.deckId===b.dataset.deck));
    case 'cram-missed':{if(!S.run)return;const keys=S.run.missed,bk=S.run.back;startCram(allCards().filter(c=>keys.has(c.key)));if(S.run)S.run.back=bk;return}
    case 'setup-plan':{const p=PLANS[Number(b.dataset.i)];if(!p)return;(p.decks||[]).forEach(id=>installLib(id));usePlan(p,true);D.setup=true;persist();return show('today')}
    case 'setup-own':D.setup=true;persist();return show('settings');
    case 'plan-lib':{const p=PLANS[Number(b.dataset.i)];if(!p)return;(p.decks||[]).forEach(id=>{if(!D.decks.find(d=>d.id===id))installLib(id)});usePlan(p,true);setMsg('plan-msg','「'+p.title+'」にしました。',true);return}
    case 'plan-import':{
      try{const p=parsePlan($('plan-text').value);usePlan(p);$('plan-text').value='';setMsg('plan-msg',p.tasks.length+'件のやることを読み込みました。'+(p.bad&&p.bad.length?'読めなかった行（'+p.bad.slice(0,8).join(', ')+'行目）は飛ばしました。':''),true)}
      catch(err){setMsg('plan-msg','読み込めませんでした。1行に1つ「日付｜科目｜やること｜分」の形で貼ってください。')}
      return;
    }
    case 'copy-tmpl':return copyText(ASK_TEMPLATE,()=>setMsg('tmpl-msg','コピーしました。',true),()=>setMsg('tmpl-msg','上の文を長押ししてコピーしてください。'));
    case 'del-score':{const i=Number(b.dataset.i),k='score:'+i;if(S.confirm!==k){S.confirm=k;return renderSettings()}S.confirm=null;D.scores.splice(i,1);persist();return renderSettings()}
    case 'lib-add':installLib(b.dataset.id);persist();return renderLibrary();
    case 'lib-add-group':{const g=libGroups().find(x=>x.name===b.dataset.group);if(g)g.decks.forEach(l=>{if(!D.decks.find(d=>d.id===l.id))installLib(l.id)});persist();return renderLibrary()}
    case 'lib-remove':{const k='lib:'+b.dataset.id;if(S.confirm!==k){S.confirm=k;return renderLibrary()}S.confirm=null;removeDeck(b.dataset.id);return renderLibrary()}
    case 'del-card':{const k='card:'+b.dataset.id;if(S.confirm!==k){S.confirm=k;return renderManage()}S.confirm=null;const d=userDecks().find(x=>x.id===S.manageDeck);if(d){d.cards=d.cards.filter(c=>c.id!==b.dataset.id);const st=Object.assign({},D.srs.cards);delete st[d.id+':'+b.dataset.id];D.srs.cards=st;persist()}return renderManage()}
    case 'del-deck':{const k='deck:'+S.manageDeck;if(S.confirm!==k){S.confirm=k;return renderManage()}S.confirm=null;removeDeck(S.manageDeck);S.manageDeck=null;return renderManage()}
    case 'export-file':return exportFile();
    case 'export-copy':{const t=backupText();return copyText(t,()=>{$('imp-msg').innerHTML='<p class="ok">コピーしました。メモアプリなどに貼って保存してください。</p>'},()=>{const ta=$('imp-text');ta.value=t;ta.focus();ta.select();$('imp-msg').innerHTML='<p class="small">自動でコピーできなかったので、上の欄に表示しました。長押しして「すべて選択」→「コピー」してください。</p>'})}
    case 'import-text':return askImport($('imp-text').value);
    case 'import-confirm':{if(!S.pendingImport)return;const b0=blank();D=Object.assign(b0,S.pendingImport,{srs:Object.assign(b0.srs,S.pendingImport.srs||{}),done:S.pendingImport.done||{},scores:S.pendingImport.scores||[],setup:true});S.pendingImport=null;persist();return show('settings')}
    case 'import-cancel':S.pendingImport=null;$('imp-msg').innerHTML='';return;
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='new-limit'){D.srs.newLimit=Math.max(0,Math.min(500,Math.round(Number(t.value)||0)));persist();return}

  if(t.id==='imp-file'&&t.files&&t.files[0]){const fr=new FileReader();fr.onload=()=>askImport(String(fr.result||''));fr.readAsText(t.files[0]);t.value=''}

document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const tag=((e.target&&e.target.tagName)||'').toLowerCase();
  if(tag==='input'||tag==='textarea'||tag==='select')return;
  if(S.screen!=='study'||!S.run)return;
  const r=S.run,c=r.queue[0];
  if(e.key==='Escape'){e.preventDefault();return back()}
  if(e.key==='z'||e.key==='Z'||e.key==='Backspace'){e.preventDefault();return undo()}
  if(!c)return;
  if(!r.shown){
    if(c.options&&/^[1-9]$/.test(e.key)&&Number(e.key)<=c.options.length){e.preventDefault();return pick(Number(e.key)-1)}
    if(!c.options&&(e.key===' '||e.key==='Enter')){e.preventDefault();return reveal()}
    return;
  }
  if(r.mode==='srs'){if(/^[1-4]$/.test(e.key)){e.preventDefault();return rate(Number(e.key))}if(e.key===' '||e.key==='Enter'){e.preventDefault();return rate(recommended())}}
  else{if(e.key==='1'||e.key==='ArrowLeft'){e.preventDefault();return cram(false)}if(e.key==='2'||e.key==='ArrowRight'||e.key===' '||e.key==='Enter'){e.preventDefault();return cram(true)}}
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  const id=e.target.id;
  if(id==='nd-form'){const title=$('nd-title').value.trim();if(!title){setMsg('nd-msg','デッキの名前を書いてください。');return}const d=createDeck(title,$('nd-subject').value);S.manageDeck=d.id;$('nd-title').value='';setMsg('nd-msg','「'+title+'」を作りました。',true);renderManage()}
  if(id==='one-form'){const front=$('m-front').value.trim(),bk=$('m-back').value.trim();if(!front||!bk){setMsg('m-msg','表と裏の両方を書いてください。');return}addCards([{front,back:bk}]);$('m-front').value='';$('m-back').value='';setMsg('m-msg','追加しました。',true);renderManage()}
  if(id==='bulk-form'){
    const lines=$('b-text').value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean),list=[],bad=[];
    lines.forEach((l,i)=>{const p=l.split(/\t|｜|\|/);const f=(p[0]||'').trim(),bk=p.slice(1).join(' / ').trim();if(p.length>=2&&f&&bk)list.push({front:f,back:bk});else bad.push(i+1)});
    if(!list.length){setMsg('b-msg','追加できる行がありません。表と裏を「｜」で区切ってください。');return}
    addCards(list);$('b-text').value='';setMsg('b-msg',list.length+'枚追加しました。'+(bad.length?'区切りのない行（'+bad.slice(0,10).join(', ')+(bad.length>10?' など':'')+'行目）は飛ばしました。':''),true);renderManage();
  }
  if(id==='score-form'){
    const score=Number($('sc-score').value),max=Number($('sc-max').value),date=$('sc-date').value;
    if(!isDate(date)||!(max>0)||!(score>=0)||score>max){setMsg('sc-msg','日付と、0から満点までの点数を入れてください。');return}
    D.scores.push({date,subject:$('sc-subject').value,title:$('sc-title').value.trim()||'テスト',score,max});persist();renderSettings();setMsg('sc-msg','記録しました。',true);
  }
});

$('nd-subject').innerHTML=SUBJECTS.filter(s=>s!=='全科目').map(s=>'<option>'+s+'</option>').join('');
let changed=false;D.decks.forEach(d=>{if(!d.builtin)return;const l=LIB.find(x=>x.id===d.id);if(l&&(l.version||1)>(d.version||1)){installLib(d.id);changed=true}});
if(D.plan&&D.plan.libId){const p=PLANS.find(x=>x.id===D.plan.libId);if(p&&(p.version||1)>(D.plan.version||1)){usePlan(p,true);changed=true}}
if(changed)persist();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&['today','plan','decks'].includes(S.screen))render()});
render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
})();
</script>
</body>
</html>
